version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: visioninspect_db
    environment:
      POSTGRES_USER: vision_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vision_password}
      POSTGRES_DB: vision_inspect_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vision_user -d vision_inspect_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: visioninspect_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://vision_user:${POSTGRES_PASSWORD:-vision_password}@postgres:5432/vision_inspect_db
      SECRET_KEY: ${SECRET_KEY:-visioninspect-secret-key-change-later}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      AUTOENCODER_MODEL_PATH: /app/models/bottle_autoencoder_v2.pth
      CLASSIFIER_MODEL_PATH: /app/models/bottle_classifier.pth
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/app/uploads
      # Phase 4: mount weights read-only so retraining never needs a rebuild.
      - ./ml/models:/app/models:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: always

  frontend:
    build:
      context: .
      dockerfile: web-app/Dockerfile
    container_name: visioninspect_frontend
    ports:
      - "3000:3000"
    environment:
      # Browser (client components) uses localhost; server-side uses internal DNS.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      INTERNAL_API_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: always

volumes:
  pgdata:
  uploads_data:
